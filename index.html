<body>

    <header class="hero-header" id="heroHeader">
        <h1 class="main-title" id="mainTitle">Куда валить?</h1>

            <span class="flag-icon" id="flagIcon"></span>
        </div>
    </header>

    <main class="main-container">
        <!-- Карточки вопросов генерируются в script ниже из QUESTION_SETS -->
        <div class="toggles-list" id="togglesList"></div>

        <div class="bottom-banner" id="bottomBanner">
            <button class="banner-button" id="bannerBtn">Найти дешевые билеты</button>
            <div class="ad-disclosure">Реклама. Go Travel Un Limited. ИНН 9909520797</div>
        </div>

        <div class="extra-links" id="extraLinks">
            <a href="#retry" class="extra-link" id="retryLink">Не согласен? Уточни с другими вопросами!</a>
            <div class="extra-link" id="shareLink">Кинуть в чат друзьям</div>
        </div>
    </main>

    <script>
        const heroHeader = document.querySelector('.hero-header');
        const mainTitle = document.getElementById('mainTitle');
        const flagContainer = document.getElementById('flagContainer');
        const flagIcon = document.getElementById('flagIcon');
        const bottomBanner = document.getElementById('bottomBanner');
        const bannerBtn = document.getElementById('bannerBtn');
        const shareLink = document.getElementById('shareLink');
        const retryLink = document.getElementById('retryLink');
        const togglesList = document.getElementById('togglesList');

        const popSound = new Audio('pop.mp3');

        function playPop() {
            popSound.currentTime = 0;
            popSound.play().catch(() => {});
        }

        const FLAGS = { GE: '🇬🇪', AM: '🇦🇲', KZ: '🇰🇿' };
        const COUNTRY_NAMES = { GE: 'Грузию', AM: 'Армению', KZ: 'Казахстан' };
        const PARTNER_LINKS = {
            KZ: 'https://aviasales.tpo.lv/4IXVhtXr?erid=2VtzqvD4Xnb',
            GE: 'https://aviasales.tpo.lv/mkebSdET?erid=2VtzqvD4Xnb',
            AM: 'https://aviasales.tpo.lv/ovy4RIZ2?erid=2VtzqvD4Xnb'
        };

        /*
         * НАБОРЫ ВОПРОСОВ
         * ----------------
         * Каждый элемент верхнего массива — отдельный набор из 7 (или сколько угодно)
         * вопросов. По клику на "Повторить" происходит переход к следующему набору
         * по кругу (0 -> 1 -> 0 -> 1 -> ...).
         *
         * Чтобы добавить вопрос в набор — допиши объект в соответствующий массив.
         * Чтобы добавить целый новый набор — допиши ещё один массив сюда, больше
         * никакой код трогать не нужно.
         *
         * points.left / points.right — сколько очков какой стране начисляется
         * за выбор левого / правого варианта. Можно указывать 1, 2 страны или ни одной.
         *
         * passport: true — ставится ТОЛЬКО на вопрос про загранпаспорт. Если выбран
         * правый вариант ("Нет") — Грузия принудительно исключается из результатов,
         * т.к. без загранпаспорта поехать туда нельзя.
         */
        const QUESTION_SETS = [
            [
                { label: "Есть загран?", left: "Да", right: "Нет", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } }, passport: true },
                { label: "Где мясо?", left: "В тесте", right: "На тесте", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } } },
                { label: "Кто ты по вайбу", left: "Нефор", right: "Нормис", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } } },
                { label: "В горах...", left: "Жить", right: "Отдыхать", points: { left: { GE: 1, AM: 1 }, right: { KZ: 1 } } },
                { label: "Понтам —", left: "Фе", right: "Быть", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } } },
                { label: "Архитектура", left: "Традиции", right: "Футуризм", points: { left: { GE: 1, AM: 1 }, right: { KZ: 1 } } },
                { label: "Что по музыке?", left: "Рейв", right: "Рэп", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } } }
            ],
            [
                { label: "Есть загран?", left: "Да", right: "Нет", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } }, passport: true },
                { label: "Шопинг", left: "Секонд", right: "Молл", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } } },
                { label: "Вода в жару", left: "Фонтанчик", right: "Газировка", points: { left: { AM: 1 }, right: { GE: 1, KZ: 1 } } },
                { label: "Тебя собьет…", left: "Белая нива", right: "Камри", points: { left: { AM: 1 }, right: { GE: 1, KZ: 1 } } },
                { label: "Договор", left: "Подписан", right: "На словах", points: { left: { KZ: 1 }, right: { GE: 1, AM: 1 } } },
                { label: "Кинза???", left: "Пойдет", right: "Фу", points: { left: { GE: 1 }, right: { AM: 1, KZ: 1 } } },
                { label: "Назначаем встречу", left: "18:55", right: "Вечером", points: { left: { KZ: 1 }, right: { GE: 1, AM: 1 } } }
            ]
        ];

        let currentSetIndex = 0;
        let currentQuestions = [];
        let sliderStates = [];
        let updateFunctions = [];
        let lastLeader = null;
        let lastChangedCountry = null;
        let previousActiveCount = 0;
        let currentDisplayedFlag = null;

        function triggerJellyShake() {
            mainTitle.classList.remove('jelly-shake');
            void mainTitle.offsetWidth;
            mainTitle.classList.add('jelly-shake');
        }

        function setDisplayContent(content) {
            if (currentDisplayedFlag !== content) {
                currentDisplayedFlag = content;
                flagIcon.classList.remove('flag-pop');
                void flagIcon.offsetWidth;
                flagIcon.textContent = content;
                flagIcon.classList.add('flag-pop');
            } else {
                flagIcon.textContent = content;
            }
        }

        function resetResultUI() {
            currentDisplayedFlag = null;
            flagContainer.classList.remove('visible');
            heroHeader.classList.remove('has-flag');
            bottomBanner.classList.remove('visible');
        }

        function calculateWinner() {
            let scores = { GE: 0, AM: 0, KZ: 0 };
            let activeCount = 0;
            let isGeorgiaBlocked = false;

            currentQuestions.forEach((question, idx) => {
                const state = sliderStates[idx];
                if (state !== 1) activeCount++;

                if (question.passport && state === 2) isGeorgiaBlocked = true;

                if (state === 0) {
                    Object.entries(question.points.left).forEach(([country, value]) => {
                        scores[country] += value;
                    });
                } else if (state === 2) {
                    Object.entries(question.points.right).forEach(([country, value]) => {
                        scores[country] += value;
                    });
                }
            });

            if (activeCount > previousActiveCount && activeCount <= 2) {
                triggerJellyShake();
            }
            previousActiveCount = activeCount;

            // Финальный экран включаем/выключаем через класс на body,
            // а не через захардкоженные CSS-селекторы под конкретное число вопросов.
            document.body.classList.toggle('all-answered', activeCount === currentQuestions.length);

            if (activeCount < 3) {
                lastLeader = null;
                resetResultUI();
                return;
            }

            if (isGeorgiaBlocked) scores.GE = -1;

            if (scores.GE <= 0 && scores.AM === 0 && scores.KZ === 0) {
                lastLeader = null;
                resetResultUI();
                return;
            }

            let maxScore = Math.max(scores.GE, scores.AM, scores.KZ);
            let leaders = Object.keys(scores).filter(country => scores[country] === maxScore && scores[country] >= 0);

            let currentWinner = null;

            if (leaders.length === 1) {
                currentWinner = leaders[0];
            } else if (leaders.length > 1) {
                if (lastChangedCountry && leaders.includes(lastChangedCountry)) {
                    currentWinner = lastChangedCountry;
                } else if (!lastLeader || !leaders.includes(lastLeader)) {
                    currentWinner = leaders[0];
                } else {
                    currentWinner = lastLeader;
                }
            }

            if (currentWinner) {
                lastLeader = currentWinner;
                setDisplayContent(FLAGS[currentWinner]);
                flagContainer.classList.add('visible');
                heroHeader.classList.add('has-flag');

                const completionPercentage = activeCount / currentQuestions.length;
                if (completionPercentage > 0.8) {
                    bannerBtn.textContent = `Найти дешевые билеты в ${COUNTRY_NAMES[currentWinner]}`;
                    bottomBanner.classList.add('visible');
                } else {
                    bottomBanner.classList.remove('visible');
                }
            } else {
                lastLeader = null;
                resetResultUI();
            }
        }

        // Строит карточки вопросов для текущего набора и навешивает на них обработчики.
        function renderQuestions() {
            currentQuestions = QUESTION_SETS[currentSetIndex];
            sliderStates = currentQuestions.map(() => 1);
            updateFunctions = [];
            lastLeader = null;
            lastChangedCountry = null;
            previousActiveCount = 0;

            document.body.classList.remove('all-answered');
            resetResultUI();

            togglesList.innerHTML = '';

            currentQuestions.forEach((question, idx) => {
                const card = document.createElement('div');
                card.className = 'toggle-card';
                card.innerHTML = `
                    <div class="toggle-row">
                        <span class="toggle-label">${question.label}</span>
                        <div class="slider-wrapper">
                            <span class="option-text left">${question.left}</span>
                            <div class="custom-switch">
                                <div class="switch-thumb"></div>
                            </div>
                            <span class="option-text right">${question.right}</span>
                        </div>
                    </div>
                `;
                togglesList.appendChild(card);

                const wrapper = card.querySelector('.slider-wrapper');
                const switchEl = card.querySelector('.custom-switch');
                const thumb = card.querySelector('.switch-thumb');
                const leftText = card.querySelector('.option-text.left');
                const rightText = card.querySelector('.option-text.right');

                function updateUI(state) {
                    sliderStates[idx] = state;

                    if (state === 0) {
                        lastChangedCountry = Object.keys(question.points.left)[0] || null;
                    } else if (state === 2) {
                        lastChangedCountry = Object.keys(question.points.right)[0] || null;
                    } else {
                        lastChangedCountry = null;
                    }

                    if (state === 0) {
                        thumb.style.transform = 'translateX(0px)';
                        thumb.classList.add('active');
                        leftText.classList.add('active');
                        rightText.classList.remove('active');
                    } else if (state === 2) {
                        thumb.style.transform = 'translateX(24px)';
                        thumb.classList.add('active');
                        leftText.classList.remove('active');
                        rightText.classList.add('active');
                    } else {
                        thumb.style.transform = 'translateX(12px)';
                        thumb.classList.remove('active');
                        leftText.classList.remove('active');
                        rightText.classList.remove('active');
                    }

                    calculateWinner();
                }

                updateFunctions.push(updateUI);

                leftText.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playPop();
                    updateUI(sliderStates[idx] === 0 ? 1 : 0);
                });

                rightText.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playPop();
                    updateUI(sliderStates[idx] === 2 ? 1 : 2);
                });

                card.addEventListener('click', (e) => {
                    if (e.target.closest('.custom-switch')) return;
                    playPop();
                    const rect = wrapper.getBoundingClientRect();
                    const clickX = e.clientX;
                    const wrapperCenter = rect.left + rect.width / 2;
                    if (clickX < wrapperCenter) {
                        updateUI(sliderStates[idx] === 0 ? 1 : 0);
                    } else {
                        updateUI(sliderStates[idx] === 2 ? 1 : 2);
                    }
                });

                switchEl.addEventListener('click', (e) => {
                    playPop();
                    const rect = switchEl.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const width = rect.width;
                    if (clickX < width / 3) {
                        updateUI(sliderStates[idx] === 0 ? 1 : 0);
                    } else if (clickX > (2 * width) / 3) {
                        updateUI(sliderStates[idx] === 2 ? 1 : 2);
                    } else {
                        updateUI(1);
                    }
                });

                updateUI(1);
            });
        }

        bannerBtn.addEventListener('click', () => {
            if (lastLeader && PARTNER_LINKS[lastLeader]) {
                window.open(PARTNER_LINKS[lastLeader], '_blank');
            }
        });

        shareLink.addEventListener('click', async () => {
            playPop();
            let shareText = 'Пройди тест и узнай, куда тебе свалить!';
            if (lastLeader && COUNTRY_NAMES[lastLeader]) {
                shareText = `Я валю в ${COUNTRY_NAMES[lastLeader]}! А ты??`;
            }
            const fullText = `${shareText} ${window.location.href}`;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile && navigator.share) {
                try {
                    await navigator.share({ title: 'Куда валить?', text: shareText, url: window.location.href });
                    return;
                } catch (err) { if (err.name === 'AbortError') return; }
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(fullText);
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = fullText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }
                const originalText = shareLink.textContent;
                shareLink.textContent = 'Текст и ссылка скопированы!';
                setTimeout(() => { shareLink.textContent = originalText; }, 2000);
            } catch (err) {
                alert('Скопируйте ссылку: ' + fullText);
            }
        });

        // Клик по "Повторить" переключает на следующий набор вопросов по кругу
        // (набор 1 -> набор 2 -> набор 1 -> ...) и полностью пересобирает карточки.
        retryLink.addEventListener('click', (e) => {
            e.preventDefault();
            playPop();

            currentSetIndex = (currentSetIndex + 1) % QUESTION_SETS.length;
            renderQuestions();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        renderQuestions();
    </script>
