    <script>
        const heroHeader = document.querySelector('.hero-header');
        const mainTitle = document.getElementById('mainTitle');
        const flagContainer = document.getElementById('flagContainer');
        const flagIcon = document.getElementById('flagIcon');
        const bottomBanner = document.getElementById('bottomBanner');
        const bannerBtn = document.getElementById('bannerBtn');
        const shareLink = document.getElementById('shareLink');
        const retryLink = document.getElementById('retryLink');

        const popSound = new Audio('pop.mp3');

        function playPop() {
            popSound.currentTime = 0;
            popSound.play().catch(() => {});
        }

        const FLAGS = {
            GE: '🇬🇪',
            AM: '🇦🇲',
            KZ: '🇰🇿'
        };

        const COUNTRY_NAMES = {
            GE: 'Грузию',
            AM: 'Армению',
            KZ: 'Казахстан'
        };

        const PARTNER_LINKS = {
            KZ: 'https://aviasales.tpo.lv/4IXVhtXr?erid=2VtzqvD4Xnb',
            GE: 'https://aviasales.tpo.lv/mkebSdET?erid=2VtzqvD4Xnb',
            AM: 'https://aviasales.tpo.lv/ovy4RIZ2?erid=2VtzqvD4Xnb'
        };

        let sliderStates = [1, 1, 1, 1, 1, 1, 1];
        let updateFunctions = [];
        let lastLeader = null;
        let lastChangedCountry = null;
        let previousActiveCount = 0;
        let currentDisplayedFlag = null;

        function triggerJellyShake() {
            mainTitle.classList.remove('jelly-shake');
            void mainTitle.offsetWidth;
            mainTitle.classList.add('jelly-shake');
        }

        function setDisplayContent(content) {
            if (currentDisplayedFlag !== content) {
                currentDisplayedFlag = content;
                flagIcon.classList.remove('flag-pop');
                void flagIcon.offsetWidth; 
                flagIcon.textContent = content;
                flagIcon.classList.add('flag-pop');
            } else {
                flagIcon.textContent = content;
            }
        }

        function calculateWinner() {
            let scores = { GE: 0, AM: 0, KZ: 0 };
            let activeCount = 0;

            sliderStates.forEach(state => {
                if (state !== 1) activeCount++;
            });

            if (activeCount > previousActiveCount && activeCount <= 2) {
                triggerJellyShake();
            }
            previousActiveCount = activeCount;

            if (activeCount < 3) {
                currentDisplayedFlag = null;
                flagContainer.classList.remove('visible');
                heroHeader.classList.remove('has-flag');
                bottomBanner.classList.remove('visible');
                return;
            }

            const isGeorgiaBlocked = (sliderStates[0] === 2);

            if (sliderStates[0] === 0) scores.GE++;
            if (sliderStates[0] === 2) { scores.AM++; scores.KZ++; }

            if (sliderStates[1] === 0) scores.GE++;
            if (sliderStates[1] === 2) { scores.AM++; scores.KZ++; }

            if (sliderStates[2] === 0) scores.GE++;
            if (sliderStates[2] === 2) { scores.AM++; scores.KZ++; }

            if (sliderStates[3] === 0) { scores.GE++; scores.AM++; }
            if (sliderStates[3] === 2) { scores.KZ++; }

            if (sliderStates[4] === 0) scores.GE++;
            if (sliderStates[4] === 2) { scores.AM++; scores.KZ++; }

            if (sliderStates[5] === 0) { scores.GE++; scores.AM++; }
            if (sliderStates[5] === 2) { scores.KZ++; }

            if (sliderStates[6] === 0) scores.GE++;
            if (sliderStates[6] === 2) { scores.AM++; scores.KZ++; }

            if (isGeorgiaBlocked) {
                scores.GE = -1;
            }

            if (scores.GE <= 0 && scores.AM === 0 && scores.KZ === 0) {
                lastLeader = null;
                currentDisplayedFlag = null;
                flagContainer.classList.remove('visible');
                heroHeader.classList.remove('has-flag');
                bottomBanner.classList.remove('visible');
                return;
            }

            let maxScore = Math.max(scores.GE, scores.AM, scores.KZ);
            let leaders = Object.keys(scores).filter(country => scores[country] === maxScore && scores[country] >= 0);

            let currentWinner = null;

            if (leaders.length === 1) {
                currentWinner = leaders[0];
            } else if (leaders.length > 1) {
                if (lastChangedCountry && leaders.includes(lastChangedCountry)) {
                    currentWinner = lastChangedCountry;
                } else if (!lastLeader || !leaders.includes(lastLeader)) {
                    currentWinner = leaders[0];
                } else {
                    currentWinner = lastLeader;
                }
            }

            if (currentWinner) {
                lastLeader = currentWinner;
                setDisplayContent(FLAGS[currentWinner]);
                flagContainer.classList.add('visible');
                heroHeader.classList.add('has-flag');

                const completionPercentage = activeCount / sliderStates.length;
                if (completionPercentage > 0.8) {
                    bannerBtn.textContent = `Найти дешевые билеты в ${COUNTRY_NAMES[currentWinner]}`;
                    bottomBanner.classList.add('visible');
                } else {
                    bottomBanner.classList.remove('visible');
                }
            } else {
                lastLeader = null;
                currentDisplayedFlag = null;
                flagContainer.classList.remove('visible');
                heroHeader.classList.remove('has-flag');
                bottomBanner.classList.remove('visible');
            }
        }

        // Переход по реф-ссылке
        bannerBtn.addEventListener('click', () => {
            if (lastLeader && PARTNER_LINKS[lastLeader]) {
                window.open(PARTNER_LINKS[lastLeader], '_blank');
            }
        });

        // Функция поделиться (исправлена для ПК и защищена от краша)
        shareLink.addEventListener('click', async () => {
            playPop();

            let shareText = 'Пройди тест и узнай, куда тебе свалить!';
            if (lastLeader && COUNTRY_NAMES[lastLeader]) {
                shareText = `Я валю в ${COUNTRY_NAMES[lastLeader]}! А ты??`;
            }

            const fullText = `${shareText} ${window.location.href}`;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile && navigator.share) {
                try {
                    await navigator.share({
                        title: 'Куда валить?',
                        text: shareText,
                        url: window.location.href
                    });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(fullText);
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = fullText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }

                const originalText = shareLink.textContent;
                shareLink.textContent = 'Текст и ссылка скопированы!';
                setTimeout(() => {
                    shareLink.textContent = originalText;
                }, 2000);
            } catch (err) {
                alert('Скопируйте ссылку: ' + fullText);
            }
        });

        // Сброс ответов при нажатии "Уточни с другими вопросами"
        retryLink.addEventListener('click', () => {
            playPop();
            updateFunctions.forEach(updateUI => updateUI(1));
        });

        document.querySelectorAll('.toggle-card').forEach((card, idx) => {
            const wrapper = card.querySelector('.slider-wrapper');
            const switchEl = card.querySelector('.custom-switch');
            const thumb = card.querySelector('.switch-thumb');
            const leftText = card.querySelector('.option-text.left');
            const rightText = card.querySelector('.option-text.right');

            function updateUI(state) {
                sliderStates[idx] = state;

                if (idx === 0) lastChangedCountry = state === 0 ? 'GE' : (state === 2 ? 'AM' : null);
                if (idx === 1) lastChangedCountry = state === 0 ? 'GE' : (state === 2 ? 'AM' : null);
                if (idx === 2) lastChangedCountry = state === 0 ? 'GE' : (state === 2 ? 'AM' : null);
                if (idx === 3) lastChangedCountry = state === 0 ? 'GE' : (state === 2 ? 'KZ' : null);
                if (idx === 4) lastChangedCountry = state === 0 ? 'GE' : (state === 2 ? 'AM' : null);
                if (idx === 5) lastChangedCountry = state === 0 ? 'GE' : (state === 2 ? 'KZ' : null);
                if (idx === 6) lastChangedCountry = state === 0 ? 'GE' : (state === 2 ? 'AM' : null);

                if (state === 0) {
                    thumb.style.transform = 'translateX(0px)';
                    thumb.classList.add('active');
                    leftText.classList.add('active');
                    rightText.classList.remove('active');
                } else if (state === 2) {
                    thumb.style.transform = 'translateX(24px)';
                    thumb.classList.add('active');
                    leftText.classList.remove('active');
                    rightText.classList.add('active');
                } else {
                    thumb.style.transform = 'translateX(12px)';
                    thumb.classList.remove('active');
                    leftText.classList.remove('active');
                    rightText.classList.remove('active');
                }
                
                calculateWinner();
            }

            updateFunctions.push(updateUI);

            leftText.addEventListener('click', (e) => {
                e.stopPropagation();
                playPop();
                updateUI(sliderStates[idx] === 0 ? 1 : 0);
            });

            rightText.addEventListener('click', (e) => {
                e.stopPropagation();
                playPop();
                updateUI(sliderStates[idx] === 2 ? 1 : 2);
            });

            card.addEventListener('click', (e) => {
                if (e.target.closest('.custom-switch')) return;
                playPop();

                const rect = wrapper.getBoundingClientRect();
                const clickX = e.clientX;
                const wrapperCenter = rect.left + rect.width / 2;

                if (clickX < wrapperCenter) {
                    updateUI(sliderStates[idx] === 0 ? 1 : 0);
                } else {
                    updateUI(sliderStates[idx] === 2 ? 1 : 2);
                }
            });

            switchEl.addEventListener('click', (e) => {
                playPop();

                const rect = switchEl.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;

                if (clickX < width / 3) {
                    updateUI(sliderStates[idx] === 0 ? 1 : 0);
                } else if (clickX > (2 * width) / 3) {
                    updateUI(sliderStates[idx] === 2 ? 1 : 2);
                } else {
                    updateUI(1);
                }
            });

            updateUI(1);
        });
    </script>
